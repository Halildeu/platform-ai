# platform-ai service CI — lint + type-check + unit tests per service.
# Runs on every PR and push to main so failures surface as logs in the PR
# instead of being discovered on the GPU host at deploy time.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Retention gate unit tests
        run: python3 -m unittest discover -s tests/unit -p "test_retention_gate.py"

      - name: Faz 24 AI gate ingest unit tests
        run: python3 -m unittest discover -s tests/unit -p "test_faz24_ai_gate_ingest.py"

      - name: Diarization decision gate unit tests
        run: python3 -m unittest discover -s tests/unit -p "test_diar_decision_gate.py"

      - name: GPU host update script unit tests
        run: python3 -m unittest discover -s tests/unit -p "test_gpu_host_update_script.py"

      - name: GPU host update script PowerShell parse
        shell: pwsh
        run: |
          foreach ($script in @(
            "deploy/gpu-host/update.ps1",
            "deploy/gpu-host/drift-guard.ps1",
            "deploy/gpu-host/deployment-state.ps1",
            "deploy/gpu-host/live-stt-runtime-contract.ps1",
            "deploy/gpu-host/start-live-stt.ps1",
            "deploy/gpu-host/live-stt-runtime-env.ps1",
            "deploy/gpu-host/configure-live-stt.ps1",
            "deploy/gpu-host/restart-acceptance.ps1",
            "deploy/gpu-host/start-meeting-ai.ps1",
            "deploy/gpu-host/meeting-ai-runtime-env.ps1",
            "deploy/gpu-host/configure-meeting-ai.ps1",
            "deploy/gpu-host/configure-private-gateway-host.ps1",
            "deploy/gpu-host/task-action-contract.ps1",
            "deploy/gpu-host/migrate-task-actions.ps1",
            "deploy/gpu-host/install.ps1"
          )) {
            [scriptblock]::Create((Get-Content -Raw $script)) | Out-Null
          }

      - name: Current retention readiness snapshot
        run: |
          set +e
          python3 scripts/retention_gate.py \
            --evidence docs/evidence/retention-readiness-2026-06-25.json \
            --repo-root .
          gate_status=$?
          if [ "$gate_status" -eq 0 ]; then
            echo "Current #156 snapshot passed prematurely; VERBIS evidence is still pending"
            exit 1
          fi
          if [ "$gate_status" -ne 1 ]; then
            echo "Current #156 snapshot must remain blocked until VERBIS evidence exists"
            exit 1
          fi

      - name: Current diarization decision snapshot
        run: |
          set +e
          python3 services/diarization-service/scripts/diar_decision_gate.py \
            --evidence docs/evidence/diar-results-2026-06-17.jsonl \
            --max-der 0.30 \
            --max-rtf 0.15 \
            --max-latency-ms 2500 \
            --max-peak-vram-delta-mb 4096 \
            --min-samples 8 > /tmp/diar-decision-result.json
          gate_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/diar-decision-result.json").read_text())
          if result.get("status") != "blocked":
              raise SystemExit(
                  "Current #161 diarization snapshot must remain blocked until "
                  "approved pilot decision evidence exists"
              )
          PY
          if [ "$gate_status" -ne 1 ]; then
            echo "Current #161 diarization decision snapshot must return non-zero while blocked"
            exit 1
          fi

      - name: Accepted #161 diarization decision evidence (pilot)
        # #235 re-review (P1): CI must actually gate the accepted evidence
        # file, not just assert an old synthetic snapshot stays blocked.
        run: |
          set +e
          python3 services/diarization-service/scripts/diar_decision_gate.py \
            --evidence docs/evidence/diar-decision-pilot-2026-07-03.jsonl \
            --max-der 0.30 \
            --max-rtf 0.05 \
            --max-latency-ms 3000 \
            --max-peak-vram-delta-mb 2500 \
            --min-samples 3 > /tmp/diar-decision-accepted-result.json
          gate_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/diar-decision-accepted-result.json").read_text())
          if result.get("status") != "pass":
              raise SystemExit(
                  "Accepted #161 pilot decision evidence must gate status=pass"
              )
          if result.get("selectedDiarization", {}).get("backend") != "pyannote":
              raise SystemExit("Accepted #161 pilot decision evidence must select pyannote")
          PY
          if [ "$gate_status" -ne 0 ]; then
            echo "Accepted #161 pilot decision evidence gate must exit 0"
            exit 1
          fi

      - name: Accepted #161 diarization overlap evidence (pyannote)
        # #235 re-review (P1): the ADR's "pyannote overlap corpus DER <= 30%"
        # acceptance claim was prose-only. Cross-backend auto-selection picks
        # the best combined quality SCORE, which can mask a DER failure
        # (SpeechBrain is faster/lighter but fails the DER ceiling here) — so
        # this machine-verifies the pyannote-only claim with --backend.
        run: |
          set +e
          python3 services/diarization-service/scripts/diar_decision_gate.py \
            --evidence docs/evidence/diar-overlap-results-2026-07-03.jsonl \
            --backend pyannote \
            --max-der 0.30 \
            --max-rtf 0.05 \
            --max-latency-ms 3000 \
            --max-peak-vram-delta-mb 2500 \
            --min-samples 3 > /tmp/diar-overlap-accepted-result.json
          gate_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/diar-overlap-accepted-result.json").read_text())
          if result.get("status") != "pass":
              raise SystemExit(
                  "Accepted #161 pyannote overlap evidence must gate status=pass"
              )
          if result.get("selectedDiarization", {}).get("backend") != "pyannote":
              raise SystemExit("Accepted #161 overlap decision evidence must select pyannote")
          PY
          if [ "$gate_status" -ne 0 ]; then
            echo "Accepted #161 pyannote overlap evidence gate must exit 0"
            exit 1
          fi

      - name: Accepted #161 diarization pilot comparison evidence (pyannote)
        # #235 re-review (P1): the ADR's "real pilot DER exists for both
        # candidates" claim had no committed SpeechBrain pilot row behind it.
        # This gates the now-committed two-backend pilot comparison file with
        # the same --backend filter as the overlap check above.
        run: |
          set +e
          python3 services/diarization-service/scripts/diar_decision_gate.py \
            --evidence docs/evidence/diar-pilot-comparison-2026-07-03.jsonl \
            --backend pyannote \
            --max-der 0.30 \
            --max-rtf 0.05 \
            --max-latency-ms 3000 \
            --max-peak-vram-delta-mb 2500 \
            --min-samples 3 > /tmp/diar-pilot-comparison-accepted-result.json
          gate_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/diar-pilot-comparison-accepted-result.json").read_text()
          )
          if result.get("status") != "pass":
              raise SystemExit(
                  "Accepted #161 pilot comparison evidence must gate status=pass"
              )
          if result.get("selectedDiarization", {}).get("backend") != "pyannote":
              raise SystemExit("Accepted #161 pilot comparison evidence must select pyannote")
          PY
          if [ "$gate_status" -ne 0 ]; then
            echo "Accepted #161 pilot comparison evidence gate must exit 0"
            exit 1
          fi

  # Detect which services this PR/push actually touched, then emit a JSON
  # array so the `service-tests` matrix can be BUILT from that array
  # (dynamic matrix). A PR that only edits `services/meeting-ai-service/**`
  # no longer waits ~20 minutes on `live-stt-service` (Whisper model
  # download) that has zero touched code. On non-PR events (e.g. `push` to
  # main) all four services are always emitted so trunk baseline is complete.
  #
  # We use dynamic matrix (not a static matrix + `if:` guard) because
  # GitHub Actions forbids the `matrix` context inside a job-level `if:` —
  # the matrix expansion happens before the job's `if:` is evaluated.
  service-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # On `push` the action falls back to comparing against the previous
          # SHA in the same ref; on `pull_request` it diffs the PR base.
          filters: |
            diarization-service:
              - 'services/diarization-service/**'
              - '.github/workflows/ci.yml'
            final-stt-service:
              - 'services/final-stt-service/**'
              - '.github/workflows/ci.yml'
            live-stt-service:
              - 'services/live-stt-service/**'
              - '.github/workflows/ci.yml'
            meeting-ai-service:
              - 'services/meeting-ai-service/**'
              - '.github/workflows/ci.yml'
      - id: list
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          DIAR: ${{ steps.filter.outputs.diarization-service }}
          FINAL_STT: ${{ steps.filter.outputs.final-stt-service }}
          LIVE_STT: ${{ steps.filter.outputs.live-stt-service }}
          MEETING_AI: ${{ steps.filter.outputs.meeting-ai-service }}
        run: |
          set -euo pipefail
          # Non-PR events (push to main, workflow_dispatch, schedule) always
          # run the full matrix. PR events include only touched services.
          if [ "$IS_PR" != "true" ]; then
            services='["diarization-service","final-stt-service","live-stt-service","meeting-ai-service"]'
          else
            selected=()
            [ "$DIAR"        = "true" ] && selected+=('"diarization-service"')
            [ "$FINAL_STT"   = "true" ] && selected+=('"final-stt-service"')
            [ "$LIVE_STT"    = "true" ] && selected+=('"live-stt-service"')
            [ "$MEETING_AI"  = "true" ] && selected+=('"meeting-ai-service"')
            if [ "${#selected[@]}" -eq 0 ]; then
              services='[]'
            else
              services="[$(IFS=,; echo "${selected[*]}")]"
            fi
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Selected services matrix: $services"

  service-tests:
    needs: service-changes
    # Skip the whole job (no matrix expansion) when no service was touched.
    # Empty-array matrix would produce zero jobs anyway; the guard here
    # keeps the CI status list clean.
    if: needs.service-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.service-changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy app

      - name: Pytest (unit)
        timeout-minutes: 15
        run: python -m pytest tests/unit -q

  gpu-host-windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meeting-ai runtime dependencies
        shell: powershell
        run: >-
          python -m pip install --disable-pip-version-check
          -r services/meeting-ai-service/requirements.txt

      - name: Windows PowerShell 5.1 parse contract
        shell: powershell
        run: |
          foreach ($script in @(
            "deploy/gpu-host/update.ps1",
            "deploy/gpu-host/drift-guard.ps1",
            "deploy/gpu-host/deployment-state.ps1",
            "deploy/gpu-host/start-live-stt.ps1",
            "deploy/gpu-host/start-meeting-ai.ps1",
            "deploy/gpu-host/bootstrap-process.ps1",
            "deploy/gpu-host/live-stt-runtime-contract.ps1",
            "deploy/gpu-host/live-stt-runtime-env.ps1",
            "deploy/gpu-host/live-stt-model-runtime.ps1",
            "deploy/gpu-host/stage-live-stt-models.ps1",
            "deploy/gpu-host/configure-live-stt.ps1",
            "deploy/gpu-host/restart-acceptance.ps1",
            "deploy/gpu-host/meeting-ai-runtime-env.ps1",
            "deploy/gpu-host/configure-meeting-ai.ps1",
            "deploy/gpu-host/configure-private-gateway-host.ps1",
            "deploy/gpu-host/task-action-contract.ps1",
            "deploy/gpu-host/migrate-task-actions.ps1",
            "deploy/gpu-host/install.ps1",
            "tests/windows/test-deployment-ledger.ps1",
            "tests/windows/test-meeting-ai-runtime.ps1",
            "tests/windows/test-private-gateway-host.ps1",
            "tests/windows/test-task-action-migration.ps1",
            "tests/windows/test-live-stt-restart-acceptance.ps1",
            "tests/windows/test-gpu-host-bootstrap.ps1"
          )) {
            [scriptblock]::Create((Get-Content -Raw $script)) | Out-Null
          }

      - name: DPAPI ACL rotation and rollback contract
        shell: powershell
        run: .\tests\windows\test-meeting-ai-runtime.ps1

      - name: Private gateway hosts shim atomicity and rollback contract
        shell: powershell
        run: .\tests\windows\test-private-gateway-host.ps1

      - name: Immutable commit ledger rollout rollback and drift contract
        shell: powershell
        run: .\tests\windows\test-deployment-ledger.ps1

      - name: Live STT fail-closed restart and runtime environment contract
        shell: powershell
        run: .\tests\windows\test-live-stt-restart-acceptance.ps1

      - name: Fresh bootstrap PS5.1 child and exact model staging contract
        shell: powershell
        run: .\tests\windows\test-gpu-host-bootstrap.ps1

      - name: Scheduled Task action migration atomicity and rollback contract
        shell: powershell
        run: .\tests\windows\test-task-action-migration.ps1
